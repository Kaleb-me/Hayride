<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hay Ride Audio Tour</title>
</head>
<body>

    <header>
        <h2>Hay Ride Audio Tour</h2>
    </header>

    <div class="button">
        <button id="startBtn">Start Tour</button>
        <button id="stopBtn" disabled>Pause</button>
    </div>

    <div>
        <p id="statusText">Tour not started</p>
        <p id="gpsInfo">GPS: waiting...</p>
    </div>

    <ul id="stopList">
        <li data-index="0">Checkpoint 1</li>
        <li data-index="1">Checkpoint 2</li>
        <li data-index="2">Checkpoint 3</li>
        <li data-index="3">Checkpoint 4</li>
        <li data-index="4">Checkpoint 5</li>
    </ul>

    <div id="manual">
        <h2>Manual Controls</h2>
        <button onclick="manualPlay(0)" class="manualBtn">Checkpoint 1</button>
        <button onclick="manualPlay(1)" class="manualBtn">Checkpoint 2</button>
        <button onclick="manualPlay(2)" class="manualBtn">Checkpoint 3</button>
        <button onclick="manualPlay(3)" class="manualBtn">Checkpoint 4</button>
        <button onclick="manualPlay(4)" class="manualBtn">Checkpoint 5</button>
    </div>

    <div>
        <img src="farmlogo.png" alt="farm logo">
        <p>&copy;Kaleb Andelin 2026 v2.5.2 </p>
    </div>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        justify-items: center;
        align-content: center;
    }

    body {
        display: grid;
        grid-template-rows: 1fr 1fr 1fr 1.5fr 4fr;
        max-width: 350px;
        margin: 0 auto;
        font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
    }

    header {
        font-size: 20px;
    }
    
    button {
        height: 50px;
        width: 150px;
        border-radius: 30px;
        box-shadow: 2px 2px 3px rgb(172, 162, 162);
        margin: 5px 5px 5px 5px;
        color: white;
        font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
    }

    #startBtn {
        background-color: green;
    }

    #stopBtn {
        background-color: red;
    }

    #manual {
        font-size: 18px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
    }
    div button {
        background-color: rgb(81, 132, 251);
    }

</style>
<script>

    const RANGE = 15; // meters; checkpoint coordinates and trigger radii are unchanged
    const REARM_MARGIN = 10; // avoid repeating a stop due to GPS drift at its boundary
    const BACKGROUND_SRC = "audios/background.mp3";

    // Safari grants playback permission per element. Start real playback on the
    // user's tap, then reuse this same player for every source on every loop.
    const tourAudio = new Audio();
    tourAudio.preload = 'auto';

    const stops = [
        { name: "Checkpoint 1", lat: 39.62826905415788, lon: -119.70759771756148, radius: RANGE, src: "audios/audio1.mp3", played: false }, // 43.816943014623455, -111.78657793572535
        { name: "Checkpoint 2", lat: 39.62865441123493, lon: -119.70675133818253, radius: RANGE, src: "audios/audio2.mp3", played: false }, // 43.81761265635099, -111.78586442868259
        { name: "Checkpoint 3", lat: 39.62858739198887, lon: -119.70485263495284, radius: RANGE, src: "audios/audio3.mp3", played: false }, // 43.8175802545048, -111.78400332289976
        { name: "Checkpoint 4", lat: 39.627513870044666, lon: -119.70571186680904, radius: RANGE, src: "audios/audio4.mp3", played: false }, // 43.8165685880185, -111.78415799925168
        { name: "Checkpoint 5", lat: 39.62749917025503, lon: -119.70713034177358, radius: RANGE, src: "audios/audio5.mp3", played: false }, // 43.8165829890852, -111.78569478365145
    ];

    let watchID = null;
    let tourRunning = false;
    let playbackBlocked = false;
    let activeStopIndex = null;
    let playingBackground = false;
    let backgroundPosition = 0;
    let playbackVersion = 0;
    const pendingStops = [];

    function setStatus(msg) {
        document.getElementById('statusText').textContent = msg;
    }

    function updateStopUI(index, state) {
        const li = document.querySelector(`#stopList li[data-index="${index}"]`);
        if (li) li.className = state;
    }

    function setButtons(canStart, canPause) {
        document.getElementById('startBtn').disabled = !canStart;
        document.getElementById('stopBtn').disabled = !canPause;
    }

    function saveBackgroundPosition() {
        if (playingBackground && Number.isFinite(tourAudio.currentTime)) {
            backgroundPosition = tourAudio.currentTime;
        }
    }

    function playbackFailed(error, version) {
        if (version !== playbackVersion || playbackBlocked) return;
        ++playbackVersion; // ignore a late rejection from an interrupted play()
        console.error('Tour playback failed:', error);
        tourAudio.pause();
        playbackBlocked = true;
        if (activeStopIndex !== null) {
            const index = activeStopIndex;
            stops[index].played = false;
            updateStopUI(index, '');
            pendingStops.unshift(index);
            activeStopIndex = null;
            setStatus(`Couldn't play ${stops[index].name} – tap Start Tour to retry`);
        } else {
            setStatus("Couldn't play background music – tap Start Tour to retry");
        }
        setButtons(true, true);
    }

    function changeSource(src, loop, position = 0) {
        const version = ++playbackVersion;
        tourAudio.pause();
        tourAudio.onloadedmetadata = null;
        tourAudio.onerror = null;
        tourAudio.onended = null;
        tourAudio.loop = loop;
        tourAudio.src = src;
        tourAudio.onloadedmetadata = () => {
            if (version !== playbackVersion || !position) return;
            if (Number.isFinite(tourAudio.duration) && position < tourAudio.duration) {
                tourAudio.currentTime = position;
            }
        };
        tourAudio.onerror = () => playbackFailed(tourAudio.error, version);
        tourAudio.onended = () => {
            if (version !== playbackVersion || activeStopIndex === null || !tourAudio.ended) return;
            updateStopUI(activeStopIndex, 'done');
            activeStopIndex = null;
            if (pendingStops.length) playNextStop();
            else if (tourRunning) playBackground();
            else {
                setStatus('Tour not started');
                setButtons(true, false);
            }
        };
        tourAudio.load();
        // Keep play() synchronous with Start/manual taps. Never prime by calling
        // pause() immediately afterward: that can abort playback before it starts.
        tourAudio.play().then(() => {
            if (version !== playbackVersion) return;
            if (activeStopIndex !== null) {
                stops[activeStopIndex].played = true;
                updateStopUI(activeStopIndex, 'active');
                setStatus(`Playing: ${stops[activeStopIndex].name}`);
            } else {
                setStatus('Background music playing...');
            }
        }).catch(error => playbackFailed(error, version));
    }

    function playBackground() {
        playingBackground = true;
        setStatus('Loading background music...');
        changeSource(BACKGROUND_SRC, true, backgroundPosition);
    }

    function playNextStop() {
        if (playbackBlocked || activeStopIndex !== null || !pendingStops.length) return;
        saveBackgroundPosition();
        playingBackground = false;
        activeStopIndex = pendingStops.shift();
        setStatus(`Loading: ${stops[activeStopIndex].name}`);
        changeSource(stops[activeStopIndex].src, false);
    }

    document.getElementById('startBtn').addEventListener('click', startTour);
    document.getElementById('stopBtn').addEventListener('click', pauseTour);

    function startTour() {
        if (!navigator.geolocation) {
            alert('Location services not available on this device.');
            return;
        }
        tourRunning = true;
        playbackBlocked = false;
        setButtons(false, true);
        // Both paths immediately call play() on the very same element.
        if (activeStopIndex === null) {
            if (pendingStops.length) playNextStop();
            else playBackground();
        }
        if (watchID === null) {
            watchID = navigator.geolocation.watchPosition(
                onLocationUpdate, onLocationError,
                { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
            );
        }
    }

    function pauseTour() {
        tourRunning = false;
        if (watchID !== null) {
            navigator.geolocation.clearWatch(watchID);
            watchID = null;
        }
        saveBackgroundPosition();
        ++playbackVersion;
        tourAudio.pause();
        // Restart interrupted narration on Start, rather than losing this stop.
        if (activeStopIndex !== null) {
            stops[activeStopIndex].played = false;
            updateStopUI(activeStopIndex, '');
            pendingStops.unshift(activeStopIndex);
            activeStopIndex = null;
        }
        playbackBlocked = false;
        setStatus('Tour paused');
        setButtons(true, false);
    }

    function onLocationUpdate(position) {
        if (!tourRunning) return; // ignore callbacks delivered after clearWatch()
        const { latitude: lat, longitude: lon, accuracy: acc } = position.coords;
        document.getElementById('gpsInfo').textContent =
            `GPS: ${lat.toFixed(6)}, ${lon.toFixed(6)}  ±${Math.round(acc)}m`;
        checkStops(lat, lon);
    }

    function onLocationError(err) {
        if (!tourRunning) return;
        console.warn('GPS error:', err.message);
        if (!playbackBlocked) setStatus('GPS error – retrying...');
    }

    function checkStops(lat, lon) {
        // Keep watching during narration: queue checkpoints we pass so long
        // recordings cannot make later stops disappear from the tour.
        stops.forEach((stop, index) => {
            const distance = getDistance(lat, lon, stop.lat, stop.lon);
            if (stop.played && distance > stop.radius + REARM_MARGIN) {
                stop.played = false;
                if (index !== activeStopIndex) updateStopUI(index, '');
            }
            if (index === activeStopIndex || pendingStops.includes(index)) return;
            if (!stop.played && distance <= stop.radius) pendingStops.push(index);
        });
        playNextStop();
    }

    function manualPlay(index) {
        if (!stops[index]) return;
        saveBackgroundPosition();
        ++playbackVersion;
        tourAudio.pause();
        if (activeStopIndex !== null) {
            stops[activeStopIndex].played = false;
            updateStopUI(activeStopIndex, '');
            activeStopIndex = null;
        }
        // A manual selection overrides the current narration, but retains any
        // other checkpoints already detected by GPS.
        const queued = pendingStops.indexOf(index);
        if (queued !== -1) pendingStops.splice(queued, 1);
        pendingStops.unshift(index);
        playbackBlocked = false;
        setButtons(!tourRunning, true);
        playNextStop();
    }

    // ── Haversine distance (metres) ───────────────────────────────────────────

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const toRad = deg => deg * Math.PI / 180;

        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);

        const a =
            Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);

        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
    }

    // ── Service worker registration (offline support) ───────────────────────

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then((reg) => console.log('Service worker registered:', reg.scope))
                .catch((err) => console.error('Service worker registration failed:', err));
        });
    }

</script>
</body>
</html>
